services:

  # =========================================
  # PostgreSQL
  # =========================================

  db:
    image: postgres:16

    container_name: dcs-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - backend

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]

      interval: 10s

      timeout: 5s

      retries: 5


  # =========================================
  # Next.js Web Application
  # =========================================

  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: dcs-web

    restart: unless-stopped

    environment:
      NODE_ENV: production

      PORT: 3000

      HOSTNAME: 0.0.0.0

      DATABASE_URL: ${DATABASE_URL}

    depends_on:
      db:
        condition: service_healthy

    networks:
      - frontend
      - backend

  # =========================================
  # Nginx
  # =========================================

  nginx:
    image: nginx:alpine

    container_name: dcs-nginx

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - web

    networks:
      - frontend


# =========================================
# Networks
# =========================================

networks:

  frontend:

  backend:
    internal: true

  monitoring:


# =========================================
# Persistent storage
# =========================================

volumes:

  postgres_data: